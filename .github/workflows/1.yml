name: Universal Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Allows you to trigger the build manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up the Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # 3. Setup Gradle and force the required version (Solves Error 2 & Error 1)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      # 4. Generate the missing debug keystore on the fly (Solves Error 3)
      - name: Generate Dummy Debug Keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "C=US, O=Android, CN=Android Debug"

      # 5. Build the Universal Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 6. Upload the compiled APK so you can download it from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-universal
          path: app/build/outputs/apk/debug/app-debug.apk
