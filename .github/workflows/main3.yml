name: Build Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run the build manually from the Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      # The official Gradle action automatically handles caching for faster builds!
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      # Only attempts to add execution permissions if the file is present
      - name: Make gradlew executable
        run: if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      # Assemble the debug APK. 
      # (If you want a release APK, change to 'assembleRelease' and setup signing)
      - name: Build Universal APK
        run: ./gradlew assembleDebug

      # Uploads the built APK so you can download it from the GitHub Actions page
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-universal
          path: app/build/outputs/apk/debug/**/*.apk
