name: Build Universal APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1' # Forces GitHub to download the correct Gradle version

    - name: Build Universal APK
      # Using system 'gradle' because './gradlew' is missing from the repository
      run: gradle assembleDebug

    - name: Upload APK Extract
      uses: actions/upload-artifact@v4
      with:
        name: universal-apk
        path: app/build/outputs/apk/debug/*.apk
